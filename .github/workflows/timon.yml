name: TIMON
on:
  schedule:
    - cron: '0 5 * * *'     # 06:00 en España (invierno); 07:00 en verano
    - cron: '30 18 * * *'   # 19:30 en España (invierno); 20:30 en verano. Repesca si faltaban datos
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calcular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Datos del PC (Drive), EODHD y FRED
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python timon_movil.py
      - name: Guardar datos
        run: |
          git config user.name "timon-bot"
          git config user.email "timon-bot@users.noreply.github.com"
          git add -A docs/datos
          git commit -m "TIMON datos $(date -u +%F)" || echo "sin cambios"
          git pull --rebase
          git push
